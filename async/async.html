<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Асинхронные пользователи</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 20px auto;
      text-align: center;
    }
    .controls {
      margin-bottom: 20px;
    }
    button {
      padding: 8px 16px;
      margin: 0 8px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: white;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    .status-message {
      margin: 15px 0;
      font-weight: bold;
      min-height: 40px;
    }
    .users-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      list-style: none;
    }
    .user-card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 15px;
      width: 250px;
      text-align: left;
      position: relative;
    }
    .user-card h3 {
      margin-bottom: 8px;
    }
    .user-card p {
      margin: 5px 0;
      font-size: 14px;
    }
    .delete-user-btn {
      background-color: #dc3545;
      margin-top: 10px;
      width: 100%;
    }
    .delete-user-btn:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="controls">
      <button id="showAllBtn">Показать всех</button>
      <button id="deleteAllBtn">Удалить всех</button>
    </div>
    <div id="statusMessage" class="status-message"></div>
    <ul id="usersContainer" class="users-container"></ul>
  </div>

  <template id="user-card-template">
    <li>
      <div class="user-card">
        <h3 class="user-name"></h3>
        <p class="user-email"></p>
        <p class="user-age"></p>
        <button class="delete-user-btn">Удалить</button>
      </div>
    </li>
  </template>

  <script type="module" src="async.js"></script>
</body>
</html>
